<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Dmm All Stars (unofficial) Pickems</title>
  </head>
  <body>
    <main id="app">
      <div class="site-header">
        <h1>DMM All Stars (unofficial) Pickems</h1>
        <section id="auth-panel" aria-label="Account">
          <p id="logged-in-banner"></p>
          <button type="button" id="show-login-button">Log in</button>
          <div id="logged-in-panel" hidden>
            <button type="button" id="logout-button">Log out</button>
          </div>
          <p id="login-status" role="status"></p>
        </section>
      </div>
      <div id="login-overlay" hidden>
        <div id="login-overlay-header">
          <div></div>
          <h2>Log in</h2>
          <button type="button" id="close-login-button" aria-label="Close login form">×</button>
        </div>
        <form id="login-form" aria-label="Request login link">
          <div class="login-form-element">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            >
          </div>
          <div class="login-form-element">
            <label for="display-name">Display name</label>
            <input
              type="text"
              id="display-name"
              name="display_name"
              placeholder="billybob (optional)"
              required
            >
          </div>
        </form>
        <button type="submit" id="login-button" form="login-form">Send link</button>
      </div>
      <section id="ranking-panel" aria-label="Team ranking"></section>
      <section id="questions-panel" aria-label="Pickem questions"></section>
      <p id="save-status" role="status"></p>
      <section id="submission-countdown" aria-label="Submission countdown"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
